<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KumaShika</title>
  <link rel="icon" type="image/png" sizes="64x64" href="assets/logo_mini.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>

<body>

  <!-- MODAL: Auth -->
  <div id="authModal" class="hidden">
    <div class="modal">
      <h3>Profile</h3>
      <button id="logoutBtn" class="hidden">Log out</button>
      <input id="usernameInput" placeholder="Enter username" autocomplete="off" />
      <div class="modal-actions">
        <button id="loginBtn">Log in</button>
        <button id="createBtn">Create account</button>
      </div>
      <p id="authMessage"></p>
    </div>
  </div>

  <!-- MODAL: New Text -->
  <div id="ownModal" class="hidden">
    <div class="modal">
      <h3>New Text</h3>
      <input id="ownTitleInput" placeholder="Title" autocomplete="off" />
      <textarea id="ownContentInput" placeholder="Paste your text here..." rows="6"></textarea>
      <div class="modal-actions">
        <button id="ownSaveBtn">Analyze & Save</button>
        <button id="ownCancelBtn">Cancel</button>
      </div>
      <p id="ownMessage"></p>
    </div>
  </div>

  <!-- MODAL: New Folder -->
  <div id="folderModal" class="hidden">
    <div class="modal">
      <h3>New Folder</h3>
      <input id="folderTitleInput" placeholder="Folder name" autocomplete="off" />
      <div class="modal-actions">
        <button id="folderSaveBtn">Add</button>
        <button id="folderCancelBtn">Cancel</button>
      </div>
      <p id="folderMessage"></p>
    </div>
  </div>

  <!-- HEADER -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="circle" id="multiplayerBtn">🎮</button>
    </div>
    <div class="topbar-center">
      <a href="index.html">
        <img src="assets/logo_long.png" alt="KumaShika logo" class="logo">
      </a>
    </div>
    <div class="topbar-right">
      <div class="circle" id="profileCircle">👤</div>
    </div>
  </header>

  <!-- STREAK -->
  <div class="streak-container">
    <div class="streak-fire">
      <span class="fire-emoji">🔥</span>
      <span class="streak-number" id="streakDays">0</span>
    </div>
    <div class="daily-goals">
      <div class="goal-item" id="goalNew">
        <div class="goal-icon">✨</div>
        <div class="goal-text">
          <div class="goal-label">New words</div>
          <div class="goal-status">0 / 60</div>
          <div class="goal-progress-bar"></div> <!-- ← ajouter -->
        </div>
        <div class="goal-check hidden">✓</div>
      </div>
      <div class="goal-item" id="goalReview">
        <div class="goal-icon">📚</div>
        <div class="goal-text">
          <div class="goal-label">Reviews</div>
          <div class="goal-status">No Reviews ✓</div>
        </div>
        <div class="goal-check hidden">✓</div>
      </div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-bar-container">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput" placeholder="Search for a kanji..." autocomplete="off" />
  </div>

  <!-- MAIN CONTENT -->
  <div id="grid" class="grid"></div>

  <!-- Single entry point — all logic is in JS modules -->
  <script type="module" src="index.js"></script>

</body>

</html>
